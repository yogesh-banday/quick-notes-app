<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quick Notes</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="app">
      <header>
        <p class="eyebrow">A tiny notes app</p>
        <h1>Quick Notes</h1>
        <p class="intro">Your notes stay in this browser after you leave.</p>
      </header>

      <form id="note-form">
        <label for="note-input">New note</label>
        <div class="composer">
          <input
            id="note-input"
            name="note"
            type="text"
            maxlength="240"
            placeholder="Write something to remember…"
            required
          />
          <button id="add-note-button" type="button">Add note</button>
        </div>
      </form>

      <section aria-labelledby="notes-heading">
        <div class="list-heading">
          <h2 id="notes-heading">Your notes</h2>
          <span id="note-count" aria-live="polite">
             <span id="count">0</span>&nbsp notes</span>
        </div>
        <p id="empty-state">No notes yet. Add your first one above.</p>
        <ul id="note-list"></ul>
      </section>
    </main>
  </body>
</html>
